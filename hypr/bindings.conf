# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
unbind = SUPER, RETURN
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
unbind = SUPER SHIFT, B
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
unbind = SUPER SHIFT ALT, B
bindd = SUPER ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
unbind = SUPER SHIFT, M
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
unbind = SUPER SHIFT, N
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"

# bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"

bindd = SUPER SHIFT, O, LogSeq, exec, omarchy-launch-or-focus ^logseq$ "uwsm-app -- ~/Applications/logseq.AppImage -disable-gpu --enable-wayland-ime"

bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime

bindd = SUPER SHIFT, E, Thunderbird, exec, omarchy-launch-or-focus ^thunderbird$ "uwsm-app -- thunderbird -disable-gpu --enable-wayland-ime"

bindd = SUPER SHIFT, X, Bitwarden, exec, omarchy-launch-or-focus ^bitwarden$ "uwsm-app -- bitwarden-desktop -disable-gpu --enable-wayland-ime"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
unbind = SUPER, A
bindd = SUPER, A, Gemini, exec, omarchy-launch-or-focus-webapp "Gemini" "https://gemini.google.com/app"

bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

unbind = SUPER, M
bindd = SUPER, M, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"

unbind = SUPER SHIFT, M
bindd = SUPER SHIFT, M, Google Maps, exec, omarchy-launch-or-focus-webapp "Google Maps" "https://maps.google.com"

unbind = SUPER SHIFT, D
bindd = SUPER SHIFT, D, Discord, exec, omarchy-launch-or-focus-webapp "Discord" "https://discord.com/channels/@me"

unbind = SUPER SHIFT, C
bindd = SUPER SHIFT, C, Google Calendar, exec, omarchy-launch-or-focus-webapp "Google Calendar" "https://calendar.google.com"

unbind = SUPER SHIFT, G
bindd = SUPER SHIFT, G, Github, exec, omarchy-launch-or-focus-webapp "Github" "https://github.com"

bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"

unbind = SUPER SHIFT, W
bindd = SUPER SHIFT, W, Wallet, exec, omarchy-launch-or-focus-webapp "Wallet" "https://web.budgetbakers.com/dashboard"

bindd = SUPER SHIFT, U, WhatsApp, exec, omarchy-launch-or-focus-webapp "WhatsApp" "https://web.whatsapp.com/"
# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
bindd = SUPER, B, Browser, exec, omarchy-launch-browser
unbind = SUPER, W
unbind = SUPER SHIFT, A
bind = SUPER, Q, killactive
bind = SUPER, W, togglefloating
unbind = SUPER SHIFT, F
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window
unbind = SUPER, T
bindd = SUPER, T, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"

# Move focus with Vim motions
unbind = SUPER, h
unbind = SUPER, l
unbind = SUPER, L
unbind = SUPER, k
unbind = SUPER, j
bindd = SUPER, h, Move Focus Left, movefocus, l
bindd = SUPER, l, Move Focus Right, movefocus, r
bindd = SUPER, k, Move Focus Up, movefocus, u
bindd = SUPER, j, Move Focus Down, movefocus, d
unbind = SUPER, left
unbind = SUPER, right
bind = SUPER, left, workspace, m-1
bind = SUPER, right, workspace, m+1
